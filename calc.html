<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Callback Calculator</title>
	<style>
		body {
			align-items: center;
			background: #eef2f7;
			display: flex;
			font-family: Arial, sans-serif;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
		}

		.calculator {
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
			padding: 24px;
			width: min(320px, calc(100% - 48px));
		}

		h1 {
			font-size: 1.5rem;
			text-align: center;
		}

		.inputs {
			display: grid;
			gap: 10px;
			grid-template-columns: 1fr 1fr;
		}

		input,
		select,
		button {
			border: 1px solid #cbd5e1;
			border-radius: 6px;
			box-sizing: border-box;
			font-size: 1rem;
			padding: 10px;
			width: 100%;
		}

		select,
		button {
			margin-top: 12px;
		}

		button {
			background: #2563eb;
			border: 0;
			color: #ffffff;
			cursor: pointer;
		}

		button:hover {
			background: #1d4ed8;
		}

		#result {
			background: #f8fafc;
			border-radius: 6px;
			margin: 16px 0 0;
			min-height: 24px;
			padding: 10px;
			text-align: center;
		}
	</style>
</head>
<body>
	<main class="calculator">
		<h1>Callback Calculator</h1>
		<div class="inputs">
			<input id="firstNumber" type="number" placeholder="First number">
			<input id="secondNumber" type="number" placeholder="Second number">
		</div>
		<select id="operation">
			<option value="add">Add (+)</option>
			<option value="subtract">Subtract (-)</option>
			<option value="multiply">Multiply (*)</option>
			<option value="divide">Divide (/)</option>
		</select>
		<button id="calculateButton" type="button">Calculate</button>
		<p id="result">Enter two numbers.</p>
	</main>

	<script>
		const operations = {
			add: (firstNumber, secondNumber) => firstNumber + secondNumber,
			subtract: (firstNumber, secondNumber) => firstNumber - secondNumber,
			multiply: (firstNumber, secondNumber) => firstNumber * secondNumber,
			divide: (firstNumber, secondNumber) => firstNumber / secondNumber
		};

		function calculate(firstNumber, secondNumber, callback) {
			return callback(firstNumber, secondNumber);
		}

		const firstNumberInput = document.querySelector('#firstNumber');
		const secondNumberInput = document.querySelector('#secondNumber');
		const operationInput = document.querySelector('#operation');
		const result = document.querySelector('#result');

		document.querySelector('#calculateButton').addEventListener('click', () => {
			const firstNumber = Number(firstNumberInput.value);
			const secondNumber = Number(secondNumberInput.value);

			if (firstNumberInput.value === '' || secondNumberInput.value === '') {
				result.textContent = 'Please enter both numbers.';
				return;
			}

			if (operationInput.value === 'divide' && secondNumber === 0) {
				result.textContent = 'Cannot divide by zero.';
				return;
			}

			const answer = calculate(
				firstNumber,
				secondNumber,
				operations[operationInput.value]
			);
			result.textContent = `Result: ${answer}`;
		});
	</script>
</body>
</html>
